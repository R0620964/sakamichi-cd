<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>坂道シリーズ CD形態比較ナビ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nogi: '#742581',  // 乃木坂パープル
            sakura: '#f19db5', // 櫻坂ピンク
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- ヘッダー -->
  <header class="bg-nogi text-white py-6 px-4 shadow-md text-center">
    <h1 class="text-2xl font-bold tracking-tight">乃木坂46 最新CD 形態別比較</h1>
    <p class="text-xs text-purple-200 mt-1">「推しの曲・映像がどれに入っているか」すぐわかる比較表</p>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- 絞り込み・推しメン検索バー -->
    <div class="bg-white rounded-xl shadow-sm p-4 mb-8 border border-slate-200 flex flex-col sm:flex-row gap-4 items-center justify-between">
      <div class="w-full sm:w-auto flex items-center gap-3">
        <label for="memberFilter" class="text-sm font-semibold whitespace-nowrap text-slate-700">推しメンで絞り込み:</label>
        <select id="memberFilter" class="w-full sm:w-64 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-nogi bg-white">
          <option value="">全員表示（選択解除）</option>
        </select>
      </div>
      <div id="filterStatus" class="text-xs text-slate-500 font-medium">
        ※メンバーを選ぶと参加楽曲・収録Typeが強調表示されます
      </div>
    </div>

    <!-- CD形態カード一覧グリッド -->
    <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>

  </main>

  <script>
    // --- 1. CDのデータ定義 ---
    const cdData = {
      title: "最新シングル（例：38thシングル）",
      releaseDate: "2026-11-25",
      types: [
        {
          id: "type-a",
          name: "初回仕様限定盤 Type-A",
          media: "CD + Blu-ray",
          price: "2,000円 (税込)",
          tracks: [
            { no: 1, title: "表題曲（タイトル未定）", members: ["井上和", "遠藤さくら", "賀喜遥香", "山下美月", "池田瑛紗"] },
            { no: 2, title: "共通カップリング曲", members: ["井上和", "遠藤さくら", "賀喜遥香", "一ノ瀬美空", "菅原咲月"] },
            { no: 3, title: "5期生楽曲", members: ["井上和", "池田瑛紗", "一ノ瀬美空", "菅原咲月", "小川彩"] }
          ],
          video: "表題曲 Music Video + 5期生個人PV",
          benefit: "全国イベント参加券 or スペシャルプレゼント応募券1枚 / 生写真1枚封入"
        },
        {
          id: "type-b",
          name: "初回仕様限定盤 Type-B",
          media: "CD + Blu-ray",
          price: "2,000円 (税込)",
          tracks: [
            { no: 1, title: "表題曲（タイトル未定）", members: ["井上和", "遠藤さくら", "賀喜遥香", "山下美月", "池田瑛紗"] },
            { no: 2, title: "共通カップリング曲", members: ["井上和", "遠藤さくら", "賀喜遥香", "一ノ瀬美空", "菅原咲月"] },
            { no: 3, title: "4期生楽曲", members: ["遠藤さくら", "賀喜遥香", "田村真佑", "筒井あやめ", "弓木奈於"] }
          ],
          video: "表題曲 Music Video + 4期生個人PV",
          benefit: "全国イベント参加券 or スペシャルプレゼント応募券1枚 / 生写真1枚封入"
        },
        {
          id: "type-c",
          name: "初回仕様限定盤 Type-C",
          media: "CD + Blu-ray",
          price: "2,000円 (税込)",
          tracks: [
            { no: 1, title: "表題曲（タイトル未定）", members: ["井上和", "遠藤さくら", "賀喜遥香", "山下美月", "池田瑛紗"] },
            { no: 2, title: "共通カップリング曲", members: ["井上和", "遠藤さくら", "賀喜遥香", "一ノ瀬美空", "菅原咲月"] },
            { no: 3, title: "アンダー楽曲", members: ["中村麗乃", "佐藤楓", "吉田綾乃クリスティー", "柴田柚菜", "松尾美佑"] }
          ],
          video: "アンダー楽曲 Music Video + ライブダイジェスト",
          benefit: "全国イベント参加券 or スペシャルプレゼント応募券1枚 / 生写真1枚封入"
        },
        {
          id: "regular",
          name: "通常盤",
          media: "CDのみ",
          price: "1,200円 (税込)",
          tracks: [
            { no: 1, title: "表題曲（タイトル未定）", members: ["井上和", "遠藤さくら", "賀喜遥香", "山下美月", "池田瑛紗"] },
            { no: 2, title: "共通カップリング曲", members: ["井上和", "遠藤さくら", "賀喜遥香", "一ノ瀬美空", "菅原咲月"] },
            { no: 3, title: "全員合唱曲", members: ["井上和", "遠藤さくら", "賀喜遥香", "池田瑛紗", "小川彩", "田村真佑"] }
          ],
          video: "映像特典なし",
          benefit: "CDショップ別先着特典のみ（生写真・応募券なし）"
        }
      ]
    };

    // --- 2. 登場メンバーを全曲から自動抽出してセレクトボックスを構築 ---
    const select = document.getElementById("memberFilter");
    const allMembers = new Set();
    cdData.types.forEach(t => {
      t.tracks.forEach(track => {
        track.members.forEach(m => allMembers.add(m));
      });
    });

    Array.from(allMembers).sort().forEach(member => {
      const option = document.createElement("option");
      option.value = member;
      option.textContent = member;
      select.appendChild(option);
    });

    // --- 3. カード描画ロジック ---
    function renderCards(selectedMember = "") {
      const container = document.getElementById("cardGrid");
      container.innerHTML = "";

      cdData.types.forEach(item => {
        const hasMember = selectedMember && item.tracks.some(tr => tr.members.includes(selectedMember));
        
        const borderClass = hasMember 
          ? "border-2 border-nogi ring-2 ring-purple-300 shadow-lg scale-[1.01]" 
          : "border border-slate-200 shadow-sm opacity-95";

        const card = document.createElement("div");
        card.className = `bg-white rounded-2xl overflow-hidden flex flex-col justify-between transition-all duration-200 ${borderClass}`;

        const trackListHtml = item.tracks.map(track => {
          const isMemberInTrack = selectedMember && track.members.includes(selectedMember);
          return `
            <li class="py-2 px-3 rounded-lg text-sm flex flex-col gap-1 ${isMemberInTrack ? 'bg-purple-50 border border-purple-200 font-semibold' : 'hover:bg-slate-50'}">
              <div class="flex items-center justify-between">
                <span><span class="text-slate-400 mr-1.5">M${track.no}.</span>${track.title}</span>
                ${isMemberInTrack ? '<span class="text-[10px] bg-nogi text-white px-1.5 py-0.5 rounded font-bold">推し歌唱</span>' : ''}
              </div>
              <div class="text-[11px] text-slate-500 font-normal">
                歌唱: ${track.members.join(", ")}
              </div>
            </li>
          `;
        }).join("");

        card.innerHTML = `
          <div>
            <div class="p-5 border-b border-slate-100 ${hasMember ? 'bg-purple-50/60' : 'bg-slate-50/50'}">
              <div class="flex justify-between items-start gap-2 mb-1">
                <span class="text-xs font-bold text-nogi bg-white border border-purple-200 px-2 py-0.5 rounded-full">${item.media}</span>
                <span class="text-xs font-semibold text-slate-500">${item.price}</span>
              </div>
              <h2 class="text-lg font-bold text-slate-900">${item.name}</h2>
              ${hasMember ? '<div class="mt-2 inline-flex items-center text-xs text-nogi font-bold bg-white px-2 py-0.5 rounded border border-purple-200">★ 推しメン収録あり！</div>' : ''}
            </div>

            <div class="p-5 space-y-4">
              <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">収録曲</h3>
                <ul class="space-y-1 divide-y divide-slate-100">
                  ${trackListHtml}
                </ul>
              </div>

              <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">特典映像 (Blu-ray)</h3>
                <p class="text-xs text-slate-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100">${item.video}</p>
              </div>
            </div>
          </div>

          <div class="p-4 bg-slate-50/80 border-t border-slate-100 text-[11px] text-slate-500">
            <span class="font-bold text-slate-600">封入特典:</span> ${item.benefit}
          </div>
        `;

        container.appendChild(card);
      });
    }

    renderCards();

    select.addEventListener("change", (e) => {
      const selected = e.target.value;
      renderCards(selected);
      const statusText = document.getElementById("filterStatus");
      if (selected) {
        statusText.innerHTML = `<span class="text-nogi font-bold">「${selected}」</span> が参加している楽曲・形態を強調中`;
      } else {
        statusText.textContent = "※メンバーを選ぶと参加楽曲・収録Typeが強調表示されます";
      }
    });
  </script>
</body>
</html>
